# openSeisVelocity conda environment (conda-forge only).
#   conda env create -f environment.yml          # or use ./install.sh
# Floors are loose minimums; the solver picks the newest compatible versions.
name: osv
channels:
  - conda-forge
  - nodefaults
dependencies:
  # toolchain for the vendored Fortran (VELEST, FMTOMO, Extras)
  - python=3.11
  - fortran-compiler      # gfortran + matching C compiler/linker, activated with the env
  - cmake>=3.20
  - make
  # scientific stack
  - numpy>=2.0
  - scipy>=1.13
  - pandas>=2.2
  - pyarrow>=15
  - xarray>=2024.1
  - netcdf4>=1.6
  - matplotlib>=3.8
  - pyproj>=3.6
  - obspy>=1.4
  # config / CLI / utilities
  - pydantic>=2
  - pyyaml
  - typer>=0.12
  - joblib>=1.3
  - jinja2>=3
  # geology / wells / 3D-model inputs and maps
  - lasio
  - rasterio
  - pyvista
  - cartopy
  # development
  - pip
  - pytest
  - pytest-cov
  - ruff
