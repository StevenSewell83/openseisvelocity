name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_conda_install:
        description: "Run the full conda install (./install.sh --dev) instead of only --dry-run"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  MPLBACKEND: Agg
  # Station_Files / legacy VELEST examples are not on CI runners: those tests skip cleanly.
  OSV_STATIONXML_DIR: /nonexistent

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src tests
      - run: ruff format --check src tests
        continue-on-error: true   # advisory until the code base is formatted

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[docs]"
      - run: python scripts/gen_config_reference.py --check
      - run: mkdocs build --strict

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: System toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gfortran cmake make
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cache Fortran build
        id: fcache
        uses: actions/cache@v4
        with:
          path: |
            build/bin
            build/share
            build/fortran
          key: fortran-${{ runner.os }}-${{ hashFiles('fortran/**', 'scripts/build_fortran.sh') }}
      - name: Build VELEST, FMTOMO and Extras
        if: steps.fcache.outputs.cache-hit != 'true'
        run: scripts/build_fortran.sh --jobs "$(nproc)"
      - name: Install package
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: osv doctor
        run: .venv/bin/osv doctor --quick
      - name: Unit tests
        run: .venv/bin/pytest -q -m "not integration"
      - name: Upload failed test directories
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-tmp
          path: /tmp/pytest-of-*/
          if-no-files-found: ignore
          retention-days: 3

  integration:
    # Runs the real VELEST / fm3d integration tests (~10 min). Tests needing external data
    # (Station_Files, legacy VELEST examples) skip automatically.
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: System toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gfortran cmake make
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cache Fortran build
        id: fcache
        uses: actions/cache@v4
        with:
          path: |
            build/bin
            build/share
            build/fortran
          key: fortran-${{ runner.os }}-${{ hashFiles('fortran/**', 'scripts/build_fortran.sh') }}
      - name: Build VELEST, FMTOMO and Extras
        if: steps.fcache.outputs.cache-hit != 'true'
        run: scripts/build_fortran.sh --jobs "$(nproc)"
      - run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Integration tests
        run: .venv/bin/pytest -q -m integration

  conda-install:
    # Exercises install.sh. Push/PR: --dry-run only. workflow_dispatch with full_conda_install:
    # a real install (micromamba + conda-forge, ~15 min).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: install.sh --dry-run
        run: ./install.sh --dry-run
      - name: Full install
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_conda_install }}
        run: |
          ./install.sh --dev --no-gmt --prefix "$RUNNER_TEMP/osv-env" --jobs "$(nproc)"
      - name: Doctor in the installed environment
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_conda_install }}
        run: |
          "$RUNNER_TEMP/osv-env/bin/osv" doctor

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: osv:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm osv:ci doctor --quick
      - run: docker run --rm osv:ci --help
